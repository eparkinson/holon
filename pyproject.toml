[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holon"
version = "0.1.0"
description = "An agent orchestration engine for higher-order AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Holon Contributors"}
]
keywords = ["ai", "agents", "orchestration", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "python-frontmatter>=1.0.0",
    "pydantic>=2.0.0",
    "litellm>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
server = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
holon = "holon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/holon"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
